<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang tải...</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    #loading { text-align: center; color: #555; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 14px;
      border: 4px solid #e5e5e5; border-top-color: #00b14f; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #meme { display: none; max-width: 100vw; max-height: 100vh; object-fit: contain; }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div>Đang tải...</div>
  <img id="meme" src="../../meme.jpg" alt="">
  <script>
    setTimeout(function () {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('meme').style.display = 'block';
    }, 1500);
  </script>
</body>
</html>
